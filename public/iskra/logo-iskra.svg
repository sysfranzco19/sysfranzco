<svg viewBox="0 0 360 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dynamic shooting green swoosh under/around the star -->
  <path d="M 28 92 C 32 70, 52 50, 78 46 C 105 42, 130 50, 142 54" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <path d="M 40 76 C 55 58, 80 48, 120 48" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 2" opacity="0.9"/>
  
  <!-- 5-Pointed Star in vivid Lila / Violet -->
  <g transform="translate(48, 38) rotate(-12)">
    <polygon points="0,-22 6.5,-7 22,-7 10,3.5 14,19 0,9.5 -14,19 -10,3.5 -22,-7 -6.5,-7" fill="#8b5cf6" stroke="#22c55e" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- ISKRA with Lila Fill and Green Outline -->
  <text x="38" y="114" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="68" letter-spacing="-1.5" fill="#8b5cf6" stroke="#22c55e" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill">
    ISKRA
  </text>

  <!-- S.R.L. in Vivid Neon / Lime Green -->
  <text x="284" y="114" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="-0.5" fill="#22c55e">
    S.R.L.
  </text>

  <!-- Tagline: Agencia Despachante de Aduana in Lila / Violet -->
  <text x="42" y="144" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="0.4" fill="#c084fc">
    Agencia Despachante de Aduana
  </text>
</svg>
